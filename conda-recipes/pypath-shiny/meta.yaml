{% set version = "1.3.0" %}

package:
  name: pypath-shiny
  version: {{ version }}

source:
  path: ../../packages/pypath-shiny

build:
  entry_points:
    - pypath-shiny = pypath_shiny.app:main
  noarch: python
  number: 0

requirements:
  host:
    - python >=3.10
    - setuptools >=68.0
    - pip
  run:
    - python >=3.10
    - pypath-ewe >=1.4.0
    # pypath-ewe[interactive,spatial] (conda has no extras)
    - plotly >=5.17.0
    - networkx >=3.0
    - geopandas >=0.12
    - folium >=0.14
    - shapely >=2.0
    - shiny >=1.8.0
    - shinywidgets >=0.8.2
    - great_tables >=0.1.0
    - shiny-deckgl >=1.14.0  # razinka channel
    - shinyswatch >=0.7.0
    - httpx >=0.24
    - uvicorn >=0.23
    - pandas >=2.0

test:
  imports:
    - pypath_shiny
    # Imports every page, so a missing runtime dependency fails the build
    # (production went down once for a missing great_tables).
    - pypath_shiny.app
  requires:
    - python

about:
  home: https://github.com/razinkele/PyPath
  summary: Shiny web frontend for PyPath EwE food web modeling
  description: |
    Interactive web dashboard for PyPath EwE food web modeling. Provides
    model editing, Ecosim simulation, diet visualization, fishing scenarios,
    species data lookup, and Ecospace spatial wizard.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - razinkele



