name: CI Auto-Fix

# Report-only: when CI fails, check whether the failure is something
# `ruff check --fix` / `ruff format` would fix, and say so in the run's job
# summary with the exact command to run. No branches, commits or PRs.
#
# The previous version pushed an auto/ci-fix/* branch on every CI failure
# and then failed to open a PR (gh had no GH_TOKEN), leaving 125 orphaned
# branches. It also checked out main rather than the commit that failed.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    # Same-repo runs only: a fork PR's CI run also triggers workflow_run, and
    # its commit must not be checked out and run here.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit that failed
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff (pinned like packages/pypath[dev])
        # From a neutral directory with -I, so nothing in the checkout can
        # shadow pip on sys.path.
        working-directory: ${{ runner.temp }}
        run: python -I -m pip install "ruff>=0.15.4,<0.16"

      - name: Report auto-fixable lint/format issues
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set +e
          ruff check --no-cache packages/ --output-format concise > /tmp/check.txt 2>&1
          check_rc=$?
          ruff format --no-cache --check packages/ > /tmp/format.txt 2>&1
          format_rc=$?
          {
            echo "## CI failure on \`${HEAD_BRANCH}\` (${HEAD_SHA:0:7})"
            echo "Failed run: ${RUN_URL}"
            echo
            if [ $check_rc -eq 0 ] && [ $format_rc -eq 0 ]; then
              echo "Lint and format are clean, so the failure is elsewhere (tests?). See the failed run."
            else
              echo "### Lint / format issues found"
              echo "Fix locally on \`${HEAD_BRANCH}\` and push:"
              echo '```bash'
              echo 'ruff check --fix packages/ && ruff format packages/'
              echo '```'
              echo '<details><summary>ruff check</summary>'
              echo
              echo '```'
              head -100 /tmp/check.txt
              echo '```'
              echo '</details>'
              echo '<details><summary>ruff format --check</summary>'
              echo
              echo '```'
              head -100 /tmp/format.txt
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
