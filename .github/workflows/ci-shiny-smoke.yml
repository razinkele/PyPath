name: Shiny smoke tests

on:
  push:
    branches: [ main, feat/*, chore/* ]
  pull_request:
    branches: [ main ]

jobs:
  shiny-smoke:
    name: Shiny smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Login shell, so every step runs inside the micromamba environment
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # shiny-deckgl is published to the razinka conda channel (PyPI lags
      # behind), so the Python environment comes from conda; everything else
      # is still installed with pip into it.
      - name: Set up Python (micromamba, razinka + conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: shiny-smoke
          create-args: >-
            python=3.11
            pip
            shiny-deckgl>=1.14.0
            -c razinka
            -c conda-forge
          cache-environment: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e 'packages/pypath[interactive,spatial]'
          pip install -e 'packages/pypath-shiny'
          pip install pytest playwright
          python -m playwright install --with-deps chromium

      - name: Run shinyswatch integration tests
        run: |
          python -m pytest -q packages/pypath-shiny/tests/test_shinyswatch_integration.py -q

      # The full Shiny unit suite (render contracts, page helpers, GT/Plotly
      # services). main auto-deploys the app, so these must gate merges.
      - name: Run Shiny unit tests
        run: |
          python -m pytest -q packages/pypath-shiny/tests --ignore=packages/pypath-shiny/tests/ui --disable-warnings

      - name: Start Shiny server
        run: |
          nohup python -m shiny run packages/pypath-shiny/src/pypath_shiny/app.py --port 8000 > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:8000 >/dev/null; then
              echo "server up"
              break
            fi
            sleep 1
          done

      - name: Run Shiny smoke script
        continue-on-error: true
        run: |
          # Run smoke script and record exit code for later decision
          python scripts/run_headless_smoke.py || true
          echo $? > smoke_exit_code.txt

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiny-smoke-artifacts
          path: |
            smoke_failure_*.png
            smoke_failure_*.html
            smoke_console_*.log
            server.log
            smoke_exit_code.txt

      - name: Fail on smoke failure
        if: always()
        run: |
          rc=$(cat smoke_exit_code.txt 2>/dev/null || echo 0)
          if [ "${rc}" != "0" ]; then
            echo "Smoke test failed with exit code ${rc}"
            echo "---- server.log ----"
            cat server.log || true
            exit ${rc}
          else
            echo "Smoke test passed"
          fi
