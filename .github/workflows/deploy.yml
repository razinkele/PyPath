name: Deploy to Shiny Server

on:
  workflow_dispatch:
    inputs:
      restart:
        description: 'Restart Shiny Server after deploy (true/false)'
        required: false
        default: 'false'
      path:
        description: 'Optional override of remote deploy path'
        required: false
        default: ''
  push:
    branches: [ main ]
    tags: ['v*', 'pypath-*-v*']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy (manual or push to main/tag)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add deploy host to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -e
          if [ -z "$DEPLOY_HOST" ]; then
            echo "DEPLOY_HOST secret is not set. Aborting." >&2
            exit 2
          fi
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Determine target path
        id: target
        env:
          INPUT_PATH: ${{ github.event.inputs.path }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$INPUT_PATH" ]; then
            echo "path=$INPUT_PATH" >> $GITHUB_OUTPUT
          else
            echo "path=$DEPLOY_PATH" >> $GITHUB_OUTPUT
          fi

      - name: Detect tag-based production deploy
        id: detect_prod
        run: |
          set -e
          echo "GITHUB_REF=${GITHUB_REF:-}"
          if [ -n "${GITHUB_REF:-}" ] && echo "${GITHUB_REF:-}" | grep -qE '^refs/tags/(v|pypath-.*-v)'; then
            echo "is_production=true" >> $GITHUB_OUTPUT
            echo "tag_name=$(echo ${GITHUB_REF#refs/tags/})" >> $GITHUB_OUTPUT
          else
            echo "is_production=false" >> $GITHUB_OUTPUT
            echo "tag_name=" >> $GITHUB_OUTPUT
          fi

      - name: Show deploy info
        run: |
          echo "Deploying to ${DEPLOY_USER}@${DEPLOY_HOST}:${{ steps.target.outputs.path }}"
          echo "Production mode: ${{ steps.detect_prod.outputs.is_production }}"
          echo "Tag: ${{ steps.detect_prod.outputs.tag_name }}"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

      - name: Create remote directory
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          TARGET="${{ steps.target.outputs.path }}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '$TARGET'"

      - name: Rsync deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e
          TARGET="${{ steps.target.outputs.path }}"
          echo "Rsync to $TARGET"
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude '.vscode' \
            --exclude 'tests' \
            --exclude 'docs' \
            --exclude 'scripts' \
            --exclude 'logs' \
            --exclude 'examples' \
            --exclude 'venv' \
            --exclude 'env' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '.ruff_cache' \
            --exclude '.mypy_cache' \
            --exclude '.benchmarks' \
            --exclude '.venv_smoke' \
            --exclude '.playwright-mcp' \
            --exclude 'build' \
            --exclude 'dist' \
            --exclude '*.egg-info' \
            --exclude 'example_model_data' \
            --exclude '/pages' \
            --exclude '/src' \
            --exclude '/Data' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:$TARGET"

      - name: Install packages on remote
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e
          TARGET="${{ steps.target.outputs.path }}"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"

          # Create venv if missing
          ssh "$REMOTE" "test -d '${TARGET}/venv' || { echo 'Creating venv...'; python3 -m venv '${TARGET}/venv'; '${TARGET}/venv/bin/pip' install --upgrade pip wheel setuptools; }"

          # Generate app.py with sys.path fix for Shiny Server
          # (Shiny Server uses su --login which prevents .pth editable installs from working)
          ssh "$REMOTE" "cat > '${TARGET}/app.py'" << 'APPENTRY'
          import sys
          import traceback
          from pathlib import Path

          app_dir = Path(__file__).parent
          sys.path.insert(0, str(app_dir / "packages" / "pypath-shiny" / "src"))
          sys.path.insert(0, str(app_dir / "packages" / "pypath" / "src"))

          try:
              from pypath_shiny.app import app
          except Exception:
              _tb = traceback.format_exc()
              sys.stderr.write(_tb)
              sys.stderr.flush()
              from shiny import App, ui

              _app_ui = ui.page_fluid(
                  ui.h3("PyPath failed to start"),
                  ui.tags.pre(_tb),
              )

              def _server(input, output, session):
                  pass

              app = App(_app_ui, _server)

          __all__ = ["app"]
          APPENTRY
          # Keep packaging tools current and clean stale editable artifacts from prior deploys.
          # This avoids pip uninstall failures when old __editable__ links no longer exist.
          ssh "$REMOTE" "set -e; \
            '${TARGET}/venv/bin/pip' install --upgrade pip setuptools wheel; \
            SITE=\$('${TARGET}/venv/bin/python' -c \"import site; print(site.getsitepackages()[0])\"); \
            rm -f "\$SITE"/__editable__.pypath_ewe-*.pth "\$SITE"/__editable___pypath_ewe_*finder.py; \
            rm -f "\$SITE"/__editable__.pypath_shiny-*.pth "\$SITE"/__editable___pypath_shiny_*finder.py; \
            rm -rf "\$SITE"/pypath_ewe-*.dist-info "\$SITE"/pypath_shiny-*.dist-info"

          # Install both packages (order matters: pypath-ewe first)
          echo "Installing packages..."
          ssh "$REMOTE" "'${TARGET}/venv/bin/pip' install -e '${TARGET}/packages/pypath'"
          ssh "$REMOTE" "'${TARGET}/venv/bin/pip' install -e '${TARGET}/packages/pypath-shiny'"
          # Log deployed version
          ssh "$REMOTE" "'${TARGET}/venv/bin/python' -c 'import pypath; print(f\"Deployed pypath-ewe v{pypath.__version__}\")'"
          ssh "$REMOTE" "'${TARGET}/venv/bin/python' -c 'import pypath_shiny; print(f\"Deployed pypath-shiny v{pypath_shiny.__version__}\")'"
          echo "Packages installed successfully."

      - name: Fix ownership and create writable directories
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          TARGET="${{ steps.target.outputs.path }}"
          # Try to chown if user has sudo without password
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "sudo -n chown -R shiny:shiny '$TARGET' 2>/dev/null || true"
          # Ensure app-writable directories exist with proper permissions
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '$TARGET/packages/pypath-shiny/src/pypath_shiny/logs' && chmod 775 '$TARGET/packages/pypath-shiny/src/pypath_shiny/logs'"

      - name: Reload app via restart.txt (no sudo required)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e
          TARGET="${{ steps.target.outputs.path }}"
          # Shiny Server reloads a Python/R app on the next request whenever
          # <app_dir>/restart.txt changes mtime. This forces a fresh worker
          # process to pick up new code/venv without needing sudo to restart
          # the whole shiny-server service.
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "touch '$TARGET/restart.txt'"
          echo "Touched $TARGET/restart.txt to reload the app."

      - name: Optional restart of Shiny Server
        if: ${{ github.event.inputs.restart == 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo "Restarting Shiny Server on ${DEPLOY_HOST} (may require sudo)"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "sudo systemctl restart shiny-server || sudo service shiny-server restart || true"

      - name: Done
        run: echo "Deploy completed."
