name: Deploy to Shiny Server

on:
  workflow_dispatch:
    inputs:
      restart:
        description: 'Restart Shiny Server after deploy (true/false)'
        required: false
        default: 'false'
      path:
        description: 'Optional override of remote deploy path'
        required: false
        default: ''
  push:
    branches: [ main ]
    tags: ['v*']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy (manual or push to main/tag)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add deploy host to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -e
          if [ -z "$DEPLOY_HOST" ]; then
            echo "DEPLOY_HOST secret is not set. Aborting." >&2
            exit 2
          fi
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Determine target path
        id: target
        env:
          INPUT_PATH: ${{ github.event.inputs.path }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$INPUT_PATH" ]; then
            echo "path=$INPUT_PATH" >> $GITHUB_OUTPUT
          else
            echo "path=$DEPLOY_PATH" >> $GITHUB_OUTPUT
          fi

      - name: Detect tag-based production deploy
        id: detect_prod
        run: |
          set -e
          echo "GITHUB_REF=${GITHUB_REF:-}"
          if [ -n "${GITHUB_REF:-}" ] && echo "${GITHUB_REF:-}" | grep -qE '^refs/tags/v'; then
            echo "is_production=true" >> $GITHUB_OUTPUT
            echo "tag_name=$(echo ${GITHUB_REF#refs/tags/})" >> $GITHUB_OUTPUT
          else
            echo "is_production=false" >> $GITHUB_OUTPUT
            echo "tag_name=" >> $GITHUB_OUTPUT
          fi

      - name: Show deploy info
        run: |
          echo "Deploying to ${DEPLOY_USER}@${DEPLOY_HOST}:${{ steps.target.outputs.path }}"
          echo "Production mode: ${{ steps.detect_prod.outputs.is_production }}"
          echo "Tag: ${{ steps.detect_prod.outputs.tag_name }}"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

      - name: Create remote directory
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          TARGET="${{ steps.target.outputs.path }}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '$TARGET'"

      - name: Rsync deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e
          TARGET="${{ steps.target.outputs.path }}"
          echo "Rsync to $TARGET"
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude '.vscode' \
            --exclude 'tests' \
            --exclude 'docs' \
            --exclude 'scripts' \
            --exclude 'logs' \
            --exclude 'examples' \
            --exclude 'venv' \
            --exclude 'env' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '.ruff_cache' \
            --exclude '.mypy_cache' \
            --exclude '.benchmarks' \
            --exclude '.venv_smoke' \
            --exclude '.playwright-mcp' \
            --exclude 'build' \
            --exclude 'dist' \
            --exclude '*.egg-info' \
            --exclude 'example_model_data' \
            --exclude '/pages' \
            --exclude '/src' \
            --exclude '/Data' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:$TARGET"

      - name: Install packages on remote
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e
          TARGET="${{ steps.target.outputs.path }}"

          # Create venv if missing, generate app.py if missing, pip install both packages
          # Using unquoted heredoc so $TARGET expands locally before being sent to remote
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" bash << REMOTE_SCRIPT
          set -e

          # Create venv if it doesn't exist
          if [ ! -d "$TARGET/venv" ]; then
            echo "Creating virtual environment..."
            python3 -m venv "$TARGET/venv"
            "$TARGET/venv/bin/pip" install --upgrade pip wheel setuptools
          fi

          # Generate app.py entry point if missing
          if [ ! -f "$TARGET/app.py" ]; then
            echo "Generating app.py entry point..."
            cat > "$TARGET/app.py" << 'APPENTRY'
          #!/usr/bin/env python3
          """PyPath Shiny Application Entry Point"""
          from pypath_shiny.app import app
          __all__ = ["app"]
          APPENTRY
          fi

          # Install both packages (order matters: pypath-ewe first)
          echo "Installing packages..."
          source "$TARGET/venv/bin/activate"
          pip install -e "$TARGET/packages/pypath"
          pip install -e "$TARGET/packages/pypath-shiny"
          deactivate
          echo "Packages installed successfully."
          REMOTE_SCRIPT

      - name: Fix ownership
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          TARGET="${{ steps.target.outputs.path }}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "sudo chown -R shiny:shiny '$TARGET'" || echo "Warning: could not fix ownership (may need sudo)"

      - name: Optional restart of Shiny Server
        if: ${{ github.event.inputs.restart == 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo "Restarting Shiny Server on ${DEPLOY_HOST} (may require sudo)"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "sudo systemctl restart shiny-server || sudo service shiny-server restart || true"

      - name: Done
        run: echo "Deploy completed."
