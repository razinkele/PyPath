name: Release & Publish

# Releases are cut on demand (Actions -> Release & Publish -> Run workflow),
# not on every push to main. Pick a bump per package:
#   none  - do not release this package
#   auto  - let semantic-release decide from the conventional commits
#           (feat -> minor, fix/perf -> patch)
#   patch / minor / major - force that bump
on:
  workflow_dispatch:
    inputs:
      ewe_bump:
        description: "pypath-ewe bump"
        type: choice
        options: [none, auto, patch, minor, major]
        default: none
      shiny_bump:
        description: "pypath-shiny bump"
        type: choice
        options: [none, auto, patch, minor, major]
        default: none

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-core:
    name: Release pypath-ewe
    if: inputs.ewe_bump != 'none'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pypath
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install python-semantic-release build

      - name: Install pypath package
        run: pip install -e .

      - name: Run EwE parity audit gate
        run: |
          python scripts/ewe_parity_audit.py \
            --matrix ../../docs/parity/ewe_parity_matrix.csv \
            --output ../../docs/parity/ewe_parity_report.json

      # --no-tag: the "Commit version bump & tag" step creates the tag. Letting
      # semantic-release tag as well made that step fail with "tag already
      # exists", so no release since 1.0.0 was ever pushed.
      - name: Semantic Release (pypath-ewe)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.ewe_bump }}
        run: |
          force=""
          if [ "$BUMP" != "auto" ]; then force="--$BUMP"; fi
          semantic-release version $force --no-push --no-commit --no-tag 2>&1 | tee /tmp/sr-output.txt
          if grep -q "No release will be made" /tmp/sr-output.txt; then
            echo "released=false" >> $GITHUB_OUTPUT
          else
            echo "released=true" >> $GITHUB_OUTPUT
            echo "version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> $GITHUB_OUTPUT
          fi

      - name: Build package
        if: steps.release.outputs.released == 'true' && vars.PUBLISH_TO_PYPI == 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true' && vars.PUBLISH_TO_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/pypath/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Commit version bump & tag
        if: steps.release.outputs.released == 'true'
        run: |
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # README badge, CLAUDE.md table, pypath-shiny's pypath-ewe floor
          # (test_release_discipline.py requires them to match)
          python scripts/sync_release_versions.py .
          git add packages/pypath/pyproject.toml packages/pypath/src/pypath/__init__.py packages/pypath/CHANGELOG.md             packages/pypath-shiny/pyproject.toml README.md CLAUDE.md
          git commit -m "chore(release): pypath-ewe v${{ steps.release.outputs.version }}"
          git tag "pypath-ewe-v${{ steps.release.outputs.version }}"
          git push origin main --tags

    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}

  release-shiny:
    name: Release pypath-shiny
    needs: release-core
    # Runs after the core job, also when that job was skipped
    if: ${{ !cancelled() && inputs.shiny_bump != 'none' && needs.release-core.result != 'failure' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pypath-shiny
    steps:
      - name: Checkout (latest, after core release commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install python-semantic-release build

      - name: Semantic Release (pypath-shiny)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.shiny_bump }}
        run: |
          force=""
          if [ "$BUMP" != "auto" ]; then force="--$BUMP"; fi
          semantic-release version $force --no-push --no-commit --no-tag 2>&1 | tee /tmp/sr-output.txt
          if grep -q "No release will be made" /tmp/sr-output.txt; then
            echo "released=false" >> $GITHUB_OUTPUT
          else
            echo "released=true" >> $GITHUB_OUTPUT
            echo "version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> $GITHUB_OUTPUT
          fi

      - name: Build package
        if: steps.release.outputs.released == 'true' && vars.PUBLISH_TO_PYPI == 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true' && vars.PUBLISH_TO_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/pypath-shiny/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Commit version bump & tag
        if: steps.release.outputs.released == 'true'
        run: |
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/sync_release_versions.py .  # CLAUDE.md version table
          git add packages/pypath-shiny/pyproject.toml packages/pypath-shiny/src/pypath_shiny/__init__.py packages/pypath-shiny/CHANGELOG.md             README.md CLAUDE.md
          git commit -m "chore(release): pypath-shiny v${{ steps.release.outputs.version }}"
          git tag "pypath-shiny-v${{ steps.release.outputs.version }}"
          git push origin main --tags

  create-github-release:
    name: Create GitHub Release
    needs: [release-core, release-shiny]
    # !cancelled(): still run when release-shiny was skipped
    if: ${{ !cancelled() && needs.release-core.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "pypath-ewe-v${{ needs.release-core.outputs.version }}"
          name: "PyPath v${{ needs.release-core.outputs.version }}"
          body: |
            ## Live deployment
            - PyPath Shiny: https://laguna.ku.lt/pypath

            ## Changelogs
            - Monorepo: https://github.com/razinkele/PyPath/blob/main/CHANGELOG.md
            - pypath-ewe: https://github.com/razinkele/PyPath/blob/main/packages/pypath/CHANGELOG.md
            - pypath-shiny: https://github.com/razinkele/PyPath/blob/main/packages/pypath-shiny/CHANGELOG.md

            ---
            Auto-generated notes:
          append_body: true
          generate_release_notes: true
