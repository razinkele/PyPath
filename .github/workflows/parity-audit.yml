name: EwE Parity Audit

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "packages/pypath/src/pypath/io/**"
      - "packages/pypath/src/pypath/core/**"
      - "docs/parity/**"
      - ".github/workflows/parity-audit.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "packages/pypath/src/pypath/io/**"
      - "packages/pypath/src/pypath/core/**"
      - "docs/parity/**"
      - ".github/workflows/parity-audit.yml"

jobs:
  parity-audit:
    name: Check EwE Functional Parity
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e "packages/pypath[dev]"

      # Compares docs/parity/ewe_parity_matrix.csv with what the code supports
      # and writes docs/parity/ewe_parity_report.json.
      - name: Run parity audit
        shell: bash
        run: |
          set -o pipefail
          python packages/pypath/scripts/ewe_parity_audit.py | tee /tmp/parity_report.txt

      - name: Validate parity matrix against code
        run: |
          cd packages/pypath
          pytest tests/test_ewe_parity_matrix.py -v

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## EwE parity audit (Python ${{ matrix.python-version }})"
            echo '```'
            cat /tmp/parity_report.txt 2>/dev/null || echo "audit did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-py${{ matrix.python-version }}
          path: |
            /tmp/parity_report.txt
            docs/parity/ewe_parity_report.json
          retention-days: 30
          if-no-files-found: warn
