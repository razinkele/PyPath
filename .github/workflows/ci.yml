name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Lint / Typecheck / Test (${{ matrix.os }} / ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.os }}-py${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            pip-${{ matrix.os }}-py${{ matrix.python-version }}-

      - name: Upgrade pip and install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e 'packages/pypath[dev]'

      - name: Ruff Lint
        run: ruff check packages/

      - name: Black check
        run: black --check packages/

      - name: Type check (mypy)
        run: mypy packages/pypath/src --config-file packages/pypath/pyproject.toml || true

      - name: Run tests (unit)
        run: |
          pytest packages/pypath/tests -q -m "not integration and not slow" --maxfail=1 --disable-warnings

      - name: Upload test results (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.os }}-${{ matrix.python-version }}
          path: .
