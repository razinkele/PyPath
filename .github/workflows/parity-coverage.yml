name: EwE Table Coverage Report

on:
  schedule:
    - cron: "0 0 * * 0"  # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  coverage-report:
    name: Generate Table Coverage Report
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e "packages/pypath[dev]"

      # Fails if docs/parity/ewe_parity_matrix.csv disagrees with the code;
      # writes docs/parity/ewe_parity_report.json.
      - name: Generate coverage report
        id: audit
        shell: bash
        run: |
          set -o pipefail
          python packages/pypath/scripts/ewe_parity_audit.py | tee /tmp/coverage_report.txt
          cd packages/pypath
          pytest tests/test_ewe_parity_matrix.py -q

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## EwE table coverage"
            echo '```'
            cat /tmp/coverage_report.txt 2>/dev/null || echo "report did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-coverage-matrix
          path: |
            docs/parity/ewe_parity_matrix.csv
            docs/parity/ewe_parity_report.json
            /tmp/coverage_report.txt
          retention-days: 90
          if-no-files-found: warn

      # Only when the audit itself failed (not pip/network errors), and only
      # one open issue: later failures add a comment to it.
      - name: Report parity regression
        if: failure() && steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Parity Audit: Coverage regression detected";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The weekly EwE parity audit failed: docs/parity/ewe_parity_matrix.csv disagrees with the code. See the job summary and artifacts: ${runUrl}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "parity",
            });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["parity", "regression", "automated"],
              });
            }
