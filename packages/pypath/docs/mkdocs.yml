site_name: PyPath EwE Documentation
site_description: Python implementation of Ecopath with Ecosim (EwE) for food web modeling
site_url: https://razinkele.github.io/PyPath/
repo_url: https://github.com/razinkele/PyPath
repo_name: razinkele/PyPath

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["../src"]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 3
            docstring_style: numpy
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Reference:
      - Core (Ecopath/Ecosim): api/core.md
      - I/O: api/io.md
      - Spatial (Ecospace): api/spatial.md
      - IBM: api/ibm.md
      - Analysis: api/analysis.md
  - Examples:
      - Basic Model: examples/basic-model.md
      - Spatial Modeling: examples/spatial.md
