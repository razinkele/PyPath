[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pypath-shiny"
version = "1.1.0"
description = "Shiny web frontend for PyPath EwE food web modeling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "PyPath Development Team"}
]
keywords = ["ecology", "ecosystem", "ecopath", "ecosim", "shiny", "dashboard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "pypath-ewe[interactive,spatial]>=1.1.1",
    "shiny>=1.8.0",
    "shinywidgets>=0.8.2",
    "plotly>=5.17.0",
    "great-tables>=0.1.0",
    "shiny-deckgl>=1.14.0",
    "shinyswatch>=0.7.0",
    "httpx>=0.24",
    "uvicorn>=0.23",
    "pandas>=2.0",
]

[project.optional-dependencies]
biodata = [
    "pypath-ewe[biodata]>=0.4.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Pinned to one formatter generation: `ruff format` output changed
    # between 0.15 and 0.16, and an unpinned spec let CI float to a
    # newer ruff than the tree was formatted with, failing the format gate.
    "ruff>=0.15.4,<0.16",
    "build>=1.0",
    "python-semantic-release>=9.0",
]

[project.urls]
Homepage = "https://github.com/razinkele/PyPath"
Repository = "https://github.com/razinkele/PyPath"

[project.scripts]
pypath-shiny = "pypath_shiny.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pypath_shiny = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: marks tests that require internet connection or external resources",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/pypath_shiny/__init__.py:__version__"]
branch = "main"
commit_message = "chore(release): pypath-shiny v{version}"
tag_format = "pypath-shiny-v{version}"
# One repo, two packages: only commits that touch this package's directory
# count towards its version and changelog. exclude_commit_patterns cannot do
# this: semantic-release v10 never drops feat/fix commits from a changelog.
commit_parser = "conventional-monorepo"
build_command = "python -m build"

[tool.semantic_release.changelog]
# Insert new versions at the existing marker (semantic-release v10 defaults
# to "<!-- version list -->", so the old top-level changelog_file setting
# wrote nothing for 1.1.0).
mode = "update"
insertion_flag = "<!--next-version-placeholder-->"
exclude_commit_patterns = [
    '''(?:chore|ci|style|test|build|docs)(?:\([^)]*?\))?!?: .+''',
    '''Merge .*''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
# Relative to the package directory, where the release workflow runs
path_filters = ["."]
allowed_tags = ["feat", "fix", "perf", "refactor", "style", "docs", "test", "ci", "chore", "build"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

